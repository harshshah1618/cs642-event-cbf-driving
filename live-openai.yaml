# Live OpenAI-compatible router profile.
#
# This is an explicit live-call profile. Canonical published results remain the
# scripted, offline `production` profile; live-model quality is exploratory and
# is never claimed by the recorded evaluation report.
#
# Setup:
#   export OPENAI_API_KEY=...
#   event-cbf router-check --profile live-openai --require-live
#   event-cbf eval --profile live-openai --run-id live-openai-v1
#
# `allow_fallback: false` makes a failed live call abort the run instead of
# silently producing scripted results. Override it deliberately for a
# fallback-inclusive diagnostic run. Always inspect `router_telemetry` in the
# run manifest and results.json.
extends: production.yaml

name: event-cbf-live-openai

router:
  backend: openai
  allow_live: true
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  api_key_env_fallback: EVENT_CBF_API_KEY
  timeout_s: 30.0
  max_retries: 2
  backoff_s: 0.25
  max_consecutive_failures: 3
  allow_fallback: false
  fail_on_fallback: false
  temperature: 0.0
  max_tokens: 8

eval:
  # Live calls cost money and wall-clock time. One seed and the core
  # comparison modes are the safe default; widen explicitly when needed.
  modes:
    - unshielded_skill
    - static_cbf
    - fixed_rate_vlm
    - proposed
  seeds: [0]
  out_dir: ../cs642-driving-runs/live-openai
  figures: false
  fail_on_regression: true
  min_route_pct: 60.0
  record_episodes: false
