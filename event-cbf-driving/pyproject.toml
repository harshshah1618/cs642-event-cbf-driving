[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-cbf-driving"
version = "0.1.0"
description = "Event-triggered VLM skill router + PPO skills + latency/uncertainty-inflated CBF shield"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
  "gymnasium>=0.29",
  "highway-env>=1.8",
  "matplotlib>=3.7",
  "tqdm>=4.65",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "transformers>=4.40", "accelerate>=0.30"]
dev = ["pytest>=7.0"]

[project.scripts]
event-cbf-train = "scripts.train_skills:main"
event-cbf-eval = "scripts.eval_stack:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["event_cbf_driving*"]
