[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-cbf-driving"
version = "1.0.0"
description = "Event-triggered VLM skill router + PPO skills + latency/uncertainty-inflated CBF shield"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
  "gymnasium>=0.29",
  "matplotlib>=3.7",
  "tqdm>=4.65",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
highway = ["highway-env>=1.8"]
metadrive = ["metadrive-simulator @ git+https://github.com/metadriverse/metadrive.git@fe54b03327b14bcfc17a9a04b60c8abbee4d7ab1"]
local = ["transformers>=4.45,<5", "accelerate>=0.30"]
report = ["reportlab>=4.0"]
dev = [
  "pytest>=7.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
]
all = [
  "highway-env>=1.8",
  "transformers>=4.45,<5",
  "accelerate>=0.30",
  "pytest>=7.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
event-cbf = "event_cbf_driving.cli:main"
event-cbf-eval = "event_cbf_driving.cli:eval_entry"
event-cbf-train = "event_cbf_driving.cli:train_entry"
event-cbf-verify = "event_cbf_driving.cli:verify_entry"
event-cbf-doctor = "event_cbf_driving.cli:doctor_entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["event_cbf_driving*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
markers = ["metadrive: real MetaDrive/Bullet integration tests (optional dependency)"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["event_cbf_driving", "tests", "scripts"]

[tool.ruff.lint]
# Keep the 3.10-compatible typing style used throughout the package. The UP
# annotation-modernization rules account for hundreds of cosmetic hits and do
# not catch defects; correctness rules stay enabled.
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = [
  "E501",  # line length is handled by the formatter
  "B008",  # function calls in argument defaults are used for dataclass-like APIs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"scripts/*" = ["E402"]  # standalone scripts bootstrap sys.path before imports
"event_cbf_driving/training.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
exclude = ["event_cbf_driving/skills/ppo.py"]
