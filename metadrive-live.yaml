# Opt-in live model with actual background inference and wall-clock pacing.
# No credentials are stored in this file. Cost-bearing calls require this
# explicit profile (or equivalent --allow-live configuration).
extends: metadrive.yaml
name: event-cbf-metadrive-live
router:
  backend: openai
  allow_live: true
  allow_fallback: false
  fail_on_fallback: true
  timeout_s: 2.0
  max_retries: 0
stack:
  router_async: true
  realtime: true
  max_pending_s: 2.0
eval:
  seeds: [0]
  modes: [fixed_rate_shielded, proposed]
  figures: false
  out_dir: ../cs642-driving-runs/metadrive-live
