# Live local Hugging Face transformers router profile.
#
# Setup:
#   pip install -e ".[local]"
#   event-cbf router-check --profile live-local --require-live
#   event-cbf eval --profile live-local --run-id live-local-v1
#
# The first run downloads the model. `trust_remote_code` stays off. The model
# is loaded on CPU by default; set EVENT_CBF_LOCAL_DEVICE=cuda/mps/auto to use
# another device. `allow_fallback: false` prevents a load/generation failure
# from silently becoming a scripted result.
extends: production.yaml

name: event-cbf-live-local

router:
  backend: local
  allow_live: true
  local_backend: transformers
  local_model: Qwen/Qwen2.5-0.5B-Instruct
  local_revision: null
  local_device: cpu
  trust_remote_code: false
  latency_s: 0.30
  timeout_s: 120.0
  max_retries: 1
  backoff_s: 0.25
  max_consecutive_failures: 3
  allow_fallback: false
  fail_on_fallback: false

eval:
  modes:
    - unshielded_skill
    - static_cbf
    - fixed_rate_vlm
    - proposed
  seeds: [0]
  out_dir: runs/live-local
  figures: false
  fail_on_regression: true
  min_route_pct: 60.0
  record_episodes: false
