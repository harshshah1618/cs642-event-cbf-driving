# Physical, straight-road evaluation; optional dependency installed separately.
# Shared frozen PPO checkpoints are evaluated for transfer, not labelled retrained.
extends: production.yaml
name: event-cbf-metadrive
shield:
  road_boundary_guard: true
stack:
  record_interactions: true
  pending_margin_on_all_calls: true
  skill_switch_guard: true
eval:
  scenarios:
    - name: two_trap
      simulator: metadrive
      duration: 20.0
      randomize: true
    - name: merge
      simulator: metadrive
      duration: 20.0
      randomize: true
    - name: dense_highway
      simulator: metadrive
      duration: 20.0
      randomize: true
  seeds: [0, 1, 2, 3, 4]
  modes: [static_cbf, fixed_rate_shielded, always_on_shielded, proposed, proposed_no_margin, proposed_no_blend]
  figures: true
  record_episodes: true
  min_route_pct: 70.0
  out_dir: runs/metadrive
