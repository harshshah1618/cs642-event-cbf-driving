name: event-cbf
seed: 0
checkpoint_dir: models/native
log_level: INFO
router:
  backend: scripted
  allow_live: false
  latency_s: 0.3
  timeout_s: 30.0
  max_retries: 2
  backoff_s: 0.25
  model: camera-router
  base_url: http://localhost:8000/v1
  api_key_env: OPENAI_API_KEY
  api_key_env_fallback: EVENT_CBF_API_KEY
  seed: 0
  max_consecutive_failures: 5
shield:
  standoff: 6.0
  headway_s: 1.1
  class_k: 2.5
  lane_half_width: 1.85
  gamma_sigma: 2.8
  sigma_cap: 10.0
  eta_latency: 1.0
  vlm_delay_s: 0.3
  ax_min: -7.5
  ax_max: 3.5
  enabled: true
  inflate: true
  pending_margin: true
  finite_checks: true
  fail_closed: true
  lateral_mode: lane
  lateral_margin: 0.0
  lookahead_s: 0.0
  emergency_decel: -7.5
  min_gap_m: 0.0
stack:
  mode: proposed
  initial_skill: CRUISE_RIGHT
  blend_ticks: 24
  fixed_rate_hz: 1.0
  always_on_hz: 10.0
  shield_clear_ticks: 16
  shield_hold_ticks: 1
  min_call_ticks: 28
  sigma_threshold_scale: 1.55
  use_blend: true
  hard_switch: false
  pending_margin: true
  pending_margin_on_all_calls: false
  abort_on_emergency: false
  freeze_speed: 0.5
  freeze_window_s: 1.0
  route_success_pct: 90.0
  max_pending_s: 2.0
  router_latency_s: null
eval:
  scenarios:
  - name: two_trap
    route_length: null
    duration: null
    seed: 0
    randomize: false
    params: {}
  - name: merge
    route_length: null
    duration: null
    seed: 0
    randomize: false
    params: {}
  - name: dense_highway
    route_length: null
    duration: null
    seed: 0
    randomize: false
    params: {}
  modes:
  - unshielded_skill
  - static_cbf
  - fixed_rate_vlm
  - always_on_vlm
  - proposed
  - proposed_no_margin
  - proposed_no_blend
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  out_dir: runs
