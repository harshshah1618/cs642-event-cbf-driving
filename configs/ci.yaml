# Fast, offline smoke profile used by CI and `make smoke`.
extends: default.yaml

name: event-cbf-ci

router:
  backend: scripted
  fail_on_fallback: true

eval:
  scenarios:
    - name: two_trap
      seed: 0
      randomize: false
      params: {}
  modes:
    - unshielded_skill
    - static_cbf
    - fixed_rate_vlm
    - proposed
  seeds: [0]
  repeats: 1
  out_dir: runs
  figures: false
  fail_on_regression: true
  min_route_pct: 60.0
  record_episodes: false
