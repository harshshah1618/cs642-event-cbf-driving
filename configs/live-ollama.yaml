# Live local Ollama router profile.
#
# Setup:
#   ollama serve
#   ollama pull qwen2.5:0.5b
#   event-cbf router-check --profile live-ollama --require-live
#   event-cbf eval --profile live-ollama --run-id live-ollama-v1
#
# The router uses Ollama's /api/generate contract; no Python LLM client is
# required. `allow_fallback: false` makes an unavailable daemon/model an error
# rather than a silent scripted result.
extends: production.yaml

name: event-cbf-live-ollama

router:
  backend: local
  allow_live: true
  local_backend: ollama
  ollama_url: http://127.0.0.1:11434
  ollama_model: qwen2.5:0.5b
  latency_s: 0.30
  timeout_s: 60.0
  max_retries: 1
  backoff_s: 0.25
  max_consecutive_failures: 3
  allow_fallback: false
  fail_on_fallback: false

eval:
  modes:
    - unshielded_skill
    - static_cbf
    - fixed_rate_vlm
    - proposed
  seeds: [0]
  out_dir: runs/live-ollama
  figures: false
  fail_on_regression: true
  min_route_pct: 60.0
  record_episodes: false
