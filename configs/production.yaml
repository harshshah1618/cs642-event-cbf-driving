extends: default.yaml
name: event-cbf-production
router:
  max_retries: 2
  backoff_s: 0.25
  max_consecutive_failures: 5
shield:
  lateral_mode: footprint
  lateral_margin: 0.35
  lookahead_s: 0.6
  finite_checks: true
  fail_closed: true
  pending_margin: true
stack:
  pending_margin: true
  pending_margin_on_all_calls: true
  max_pending_s: 2.0
  shield_hold_ticks: 10
  abort_on_emergency: true
eval:
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
