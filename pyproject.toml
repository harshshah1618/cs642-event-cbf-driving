[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-cbf-driving"
version = "1.0.0"
description = "Event-triggered VLM skill router + PPO skills + latency/uncertainty-inflated CBF shield"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
  "gymnasium>=0.29",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
metadrive = ["metadrive-simulator @ git+https://github.com/metadriverse/metadrive.git@fe54b03327b14bcfc17a9a04b60c8abbee4d7ab1"]
camera = ["transformers==4.57.6", "accelerate>=0.30", "safetensors==0.8.0", "peft"]
report = ["reportlab>=4.0"]
dev = [
  "pytest>=7.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  # Used by the camera contracts in the offline test suite.
  "transformers==4.57.6",
  "safetensors==0.8.0",
]

[project.scripts]
event-cbf = "driving.cli:main"
event-cbf-eval = "driving.cli:eval_entry"
event-cbf-train = "driving.cli:train_entry"
event-cbf-verify = "driving.cli:verify_entry"
event-cbf-doctor = "driving.cli:doctor_entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["driving*"]

[tool.setuptools.package-data]
driving = ["CLEANRL_LICENSE.txt"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -p no:cacheprovider"
markers = ["metadrive: real MetaDrive/Bullet integration tests (optional dependency)"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["driving", "tests", "tools"]
cache-dir = "../cs642-driving-cache/ruff"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"tools/*" = ["E402"]

[tool.mypy]
cache_dir = "../cs642-driving-cache/mypy"
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
files = ["driving"]

[tool.coverage.run]
source = ["driving"]
